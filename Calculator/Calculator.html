<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="Calculator.css">
    <link rel="icon" type="image/x-icon" href="Assets/CalculatorFavicon.png">
</head>

<body> 
    <div class="container">
        <!-- <div class="name">CALCU <wbr> LATOR</div> -->
        <div class="calc">
            <input type="text" class="display" readonly>
            <div class="btn allClear">AC</div>
            <div class="btn delete">Del</div>
            <div class="btn button divide">/</div>
            <div class="btn button">7</div>
            <div class="btn button">8</div>
            <div class="btn button">9</div>
            <div class="btn button multiply">x</div>
            <div class="btn button">4</div>
            <div class="btn button">5</div>
            <div class="btn button">6</div>
            <div class="btn button sign minus">-</div>
            <div class="btn button">1</div>
            <div class="btn button">2</div>
            <div class="btn button">3</div>
            <div class="btn button sign add">+</div>
            <div class="btn button">00</div>
            <div class="btn button">0</div>
            <div class="btn equalTo">=</div>
        </div>
    </div>
    <script src="Calculator.js"></script>
</body>

</html>
