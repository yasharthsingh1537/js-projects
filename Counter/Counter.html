<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link href="src/output.css" rel="stylesheet">
</head>

<body class="h-screen w-screen flex flex-col justify-center items-center bg-red-300">
    <div class="container w-[50vw] min-w-[550px] flex flex-col justify-center items-center bg-blue-400 rounded-2xl border-2 p-2">
        <input type="text" class="score border-4 rounded-2xl border-pink-500 text-center font-bold text-4xl pt-2 pb-2 pl-4 pr-4 m-2" readonly>
        <div class="options">
            <button class="plus border-4 rounded-2xl border-pink-500 text-center  font-bold text-4xl pt-2 pb-2 pl-4 pr-4 m-2 select-none">+</button>
            <button class="minus border-4 rounded-2xl border-pink-500 text-center font-bold text-4xl pt-2 pb-2 pl-4 pr-4 m-2 select-none">-</button>
            <button class="reset border-4 rounded-2xl border-pink-500 text-center font-bold text-4xl pt-2 pb-2 pl-4 pr-4 m-2 hover:underline select-none">RESET</button>
        </div> 
    </div>

    <script src="Counter.js"></script>
</body>
 
</html>
