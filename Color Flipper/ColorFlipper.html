<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Flipper</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        .container {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .display {
            height: 150px;
            width: 450px;
            border: 5px solid rgb(39, 39, 39);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 50px;
            font-weight: 900;
            user-select: none;
            transition: all 0.3s ease;
        }

        button {
            height: 60px;
            width: 100px;
            border: 5px solid black;
            border-radius: 100px;
            font-size: 20px;
            font-weight: 900;
            user-select: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="display"></div>
        <button>CLICK</button>
    </div>
    <script src="ColorFlipper.js"></script>
</body>

</html>
